<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #E9EBE4;
    font-family: 'Archivo', -apple-system, Helvetica, Arial, sans-serif;
    color: #1C1F1D;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  img.logo { width: 660px; height: auto; display: block; margin-bottom: 46px; }
  p.tag {
    font-size: 36px; font-weight: 500; color: #26292A; letter-spacing: -0.02em;
    max-width: 20ch; line-height: 1.15;
  }
  p.sub {
    margin-top: 20px; font-size: 24px; font-weight: 400; color: #6a6e64; letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <img class="logo" src="../assets/logo-esmalte-alpha.png" alt="Esmalte Studio">
  <p class="tag">Redes y contenido para clínicas dentales</p>
  <p class="sub">Tú solo apruebas. Nosotros hacemos el resto.</p>
</body>
</html>
